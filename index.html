<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3b6ef6" />
<title>MacroDay — Theo dõi dinh dưỡng</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MacroDay" />
<meta name="description" content="Theo dõi calo và macro hằng ngày, hoạt động offline." />
<style>
/* ===== MacroDay — nhấn xanh dương tươi, macro đa sắc, nền sáng dễ đọc ===== */
:root{
  /* nhấn CAM cho vòng & FAB, chữ gần đen, nền trắng/xám — theo phong cách ảnh */
  --orange-400:#ff9a4d;--orange-500:#ff7a1a;--orange-600:#f26410;
  --bg:#f1f2f5;--bg1:#eceef2;--bg2:#f5f6f9;--surface:#ffffff;--surface-2:#f6f7f9;
  --input-bg:#ffffff;--input-border:#e4e7ee;--text:#14161c;--text-soft:#5b616e;
  --text-muted:#969ba8;--accent:#20242e;--accent-strong:#0e1015;--accent-soft:#eef0f4;
  --border:#ececf1;--ring:rgba(34,37,46,.16);--track:#ededf1;
  --shadow-sm:0 1px 2px rgba(20,22,28,.05);--shadow-md:0 10px 26px rgba(20,22,28,.08);--shadow-lg:0 20px 46px rgba(20,22,28,.14);
  --radius:22px;--radius-sm:14px;--danger:#e11d48;--ok:#16a34a;--warn:#d97706;--star:#f59e0b;
  --app-bg:linear-gradient(180deg,#3f86e0 0%,#5a9be8 26%,#83b4ef 50%,#c9dcf3 76%,#eef1f6 100%);
  --hero-ink:#ffffff;
}
[data-theme='dark']{
  --app-bg:linear-gradient(180deg,#1a2c52 0%,#16203a 30%,#111319 65%,#0d0e12 100%);
  --hero-ink:#ffffff;
  --bg:#0d0e12;--bg1:#15171d;--bg2:#0b0c10;--surface:#191b21;--surface-2:#21242c;
  --input-bg:#23262f;--input-border:#343945;--text:#f3f4f7;--text-soft:#c1c6d0;--text-muted:#868c99;
  --accent:#f3f4f7;--accent-strong:#ffffff;--accent-soft:#262a33;--border:#282c35;
  --ring:rgba(255,255,255,.2);--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 10px 28px rgba(0,0,0,.5);--shadow-lg:0 20px 48px rgba(0,0,0,.6);--track:#2a2e38;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color:var(--text);background:var(--bg);
  background-image:var(--app-bg);
  background-attachment:fixed;background-repeat:no-repeat;-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,button,textarea{font-family:inherit;font-size:16px}
svg{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:760px;margin:0 auto;padding:16px 16px 108px;padding-top:calc(14px + env(safe-area-inset-top))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;flex:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:800;color:var(--hero-ink)}
.brand p{margin:0;font-size:12px;color:rgba(255,255,255,.8)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.icon-btn:active{transform:scale(.95)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:none;padding:18px}
.card+.card{margin-top:14px}
.card-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0 0 14px;color:var(--text)}
.card-title svg{color:var(--accent)}
.section-gap{display:grid;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:13px;padding:12px 16px;font-weight:600;font-size:14.5px;transition:transform .1s,box-shadow .15s,background .15s;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.btn-primary{background:var(--accent);color:var(--surface);border-color:transparent;box-shadow:var(--shadow-sm)}
.btn-primary:hover{box-shadow:var(--shadow-md)}
.btn-block{width:100%}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent;min-height:44px;padding:8px 10px}
.btn-danger:hover{background:rgba(225,29,72,.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-strong)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--text-soft)}
.input,.select{width:100%;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:var(--radius-sm);padding:13px 14px;color:var(--text);font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s;min-height:50px;box-shadow:none}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.input::placeholder{color:var(--text-muted);font-weight:500}
.input::placeholder{color:var(--text-muted)}
textarea.input{resize:vertical;min-height:110px;line-height:1.55}

.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.goal-item{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px;background:var(--surface-2)}
.goal-item label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:9px}
.goal-item .swatch{width:10px;height:10px;border-radius:3px;flex:none}
.goal-input{display:flex;align-items:baseline;gap:6px}
.goal-input input{width:100%;border:none;outline:none;background:transparent;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.goal-input .unit{font-size:12.5px;font-weight:700;color:var(--text-muted)}

.ring-wrap{display:flex;justify-content:center;padding:4px 0 14px}
.ring-svg{width:100%;max-width:236px;height:auto;overflow:visible}
.rings-wrap{display:flex;justify-content:center;padding:4px 0 16px}
.rings-svg{width:100%;max-width:272px;height:auto;overflow:visible}
.ring-tap{cursor:pointer}
.rlegend{display:flex;flex-direction:column;gap:8px}
.rleg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface-2);border-radius:13px;padding:11px 13px;min-height:48px;transition:border-color .15s,background .15s,transform .08s}
.rleg:active{transform:translateY(1px)}
.rleg.active{border-color:var(--accent);background:var(--accent-soft)}
.rleg:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.rdot{width:13px;height:13px;border-radius:5px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.rnm{font-weight:700;font-size:14px}
.rvv{margin-left:auto;font-size:13px;color:var(--text-muted);font-weight:600;white-space:nowrap}
.rvv b{font-size:14.5px;font-weight:800}
.rpct{font-size:13.5px;font-weight:800;color:var(--accent-strong);min-width:46px;text-align:right}
.mbars{display:flex;flex-direction:column;gap:15px}
.mbar-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mdot{width:12px;height:12px;border-radius:4px;flex:none}
.mnm{font-weight:700;font-size:14px}
.mval{margin-left:auto;font-size:13px;color:var(--text-muted);font-weight:600}
.mval b{font-weight:800;font-size:15px}
.mbar-track{height:13px;border-radius:999px;background:var(--track);overflow:hidden}
.mbar-track>span{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.mbar-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);font-weight:600;margin-top:6px}

.viewing{margin-top:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface-2);padding:15px}
.viewing-head{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.viewing-head .swatch{width:14px;height:14px;border-radius:5px}
.viewing-head .name{font-weight:700;font-size:14.5px}
.viewing-head .tag{margin-left:auto;font-size:11.5px;color:var(--text-muted);font-weight:700}
.viewing-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
.viewing-stat .k{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:2px}
.viewing-stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.viewing-stat .v small{font-size:11px;color:var(--text-muted);font-weight:600}
.progress{height:12px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-soft);margin-top:8px}

.macro-table{display:flex;flex-direction:column;gap:9px}
.macro-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);transition:border-color .15s;text-align:left;width:100%}
.macro-row.active{border-color:var(--accent);background:var(--accent-soft)}
.macro-row:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.macro-row .swatch{width:12px;height:12px;border-radius:4px}
.macro-row .mname{font-weight:700;font-size:14px}
.macro-row .msub{font-size:12px;color:var(--text-muted)}
.macro-row .mval .used{font-weight:800;font-size:15px}
.macro-row .mval .goal{font-size:12px;color:var(--text-muted)}
.macro-row .mval{text-align:right}
.mini-progress{grid-column:1/-1;height:7px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.mini-progress>span{display:block;height:100%;border-radius:999px;transition:width .4s}

.remaining-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.remaining-item{border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface-2);padding:13px}
.remaining-item .rk{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.remaining-item .swatch{width:10px;height:10px;border-radius:3px}
.remaining-item .rv{font-size:22px;font-weight:800;letter-spacing:-.03em}
.remaining-item .rv small{font-size:12px;font-weight:700;color:var(--text-muted);margin-left:2px}
.remaining-item.done{border-color:var(--ok);background:var(--accent-soft)}
.remaining-item.done .rv{color:var(--ok)}

.food-list{display:flex;flex-direction:column;gap:10px}
.food-item{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface)}
.favatar{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.fmain{min-width:0}
.food-item .fname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-item .fmeta{font-size:12px;color:var(--text-muted);margin-top:1px}
.food-item .fmeta b{color:var(--text-soft);font-weight:700}
.fchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.fchip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap}
.food-item .fright{display:flex;align-items:center;gap:6px}
.fgi{width:62px;text-align:right;padding:8px 9px;min-height:40px;font-size:14px}
.ficon{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);display:grid;place-items:center;flex:none}
.ficon:active{transform:scale(.94)}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
/* ===== Hero xanh gradient + kính mờ ===== */
.hero-blue{padding:2px 2px 6px;margin-bottom:16px}
.days-b{display:flex;justify-content:space-between;gap:2px;margin-bottom:18px}
.dayb{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:rgba(255,255,255,.72);border-radius:14px}
.dayb-dow{font-size:12px;font-weight:700}
.dayb-num{font-size:16px;font-weight:700}
.dayb.on{color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dayb.on .dayb-dow{font-weight:800}
.dayb.on .dayb-num{font-size:20px;font-weight:800}
.dayb:active{opacity:.7}
.hero-seg{display:flex;justify-content:center;margin-bottom:14px}
.hero-seg .seg-in{display:inline-flex;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px;gap:2px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero-seg span{padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.8)}
.hero-seg span.on{background:#fff;color:#1c2740}
.cal-big{text-align:center;font-size:76px;line-height:1;font-weight:800;color:#fff;letter-spacing:-.04em;margin-top:4px;text-shadow:0 4px 24px rgba(20,40,90,.18)}
.cal-sub{text-align:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85);margin-top:8px}
.mglass{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.mgcard{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);border-radius:20px;padding:14px 10px;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mg-lbl{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.9)}
.mg-pct{font-size:26px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:-.02em}
.mg-sub{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.75);margin-top:2px}
/* Day strip */
.days-card{padding:14px 12px}
.days-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.days-today{font-size:17px;font-weight:800;letter-spacing:-.02em}
.days-date{font-size:12.5px;color:var(--text-muted);font-weight:600}
.days{display:flex;justify-content:space-between;gap:2px}
.day{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.day-dow{font-size:11px;font-weight:700;color:var(--text-muted)}
.day.today .day-dow{color:var(--text)}
.day-circle{position:relative;width:40px;height:40px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--text-soft)}
.day-circle.today{background:var(--accent);color:var(--surface);border-radius:50%;font-weight:800}
.day-ring{position:absolute;inset:0;width:40px;height:40px}
.day-num{position:relative;z-index:1}
.day:active{opacity:.7}
/* Hero */
.hero-card{padding:20px 18px}
.hero{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
.hero-stat{text-align:center;flex:none}
.hnum{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
.hlbl{font-size:12.5px;font-weight:600;color:var(--text-muted);margin-top:2px}
.hero-ring{flex:none;width:60%;max-width:220px}
.hero-ring-svg{width:100%;height:auto;overflow:visible}
.mbars2{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:16px}
.mb2{text-align:left;padding:12px 13px;border-radius:16px}
.mb2-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.01em;margin-bottom:6px}
.mb2-dot{width:8px;height:8px;border-radius:50%;flex:none}
.mb2-top{margin-bottom:9px;display:flex;align-items:baseline;gap:3px}
.mb2-top b{font-weight:800;font-size:22px;letter-spacing:-.02em}
.mb2-top span{color:var(--text-muted);font-weight:700;font-size:12px}
.mb2-bar{height:8px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden}
[data-theme='dark'] .mb2-bar{background:rgba(255,255,255,.1)}
.mb2-bar>span{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.log-head{display:flex;align-items:center;gap:8px;border:none;background:transparent;padding:0;color:var(--text)}
.log-count{font-size:12px;font-weight:800;color:var(--text-muted);background:var(--accent-soft);border-radius:999px;padding:1px 9px;min-width:22px}
.chev-r{display:grid;place-items:center;color:var(--text-muted);transition:transform .2s;transform:rotate(-90deg)}
.chev-r.open{transform:rotate(0deg)}

.empty{text-align:center;padding:30px 16px;color:var(--text-muted)}
.empty svg{margin:0 auto 10px;color:var(--orange-400)}
.empty .t{font-size:14px}
.divider{height:1px;background:var(--border);margin:16px 0;border:none}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.helper{font-size:12px;color:var(--text-muted);line-height:1.55}
.status-ok{color:var(--ok);font-size:12.5px;font-weight:600}
.status-err{color:var(--danger);font-size:12.5px;font-weight:600}
details.collapsible>summary{cursor:pointer;font-weight:700;font-size:14px;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px;color:var(--text);min-height:44px}
details.collapsible>summary::-webkit-details-marker{display:none}
details.collapsible>summary .chev{margin-left:auto;color:var(--text-muted);transition:transform .2s}
details.collapsible[open]>summary .chev{transform:rotate(180deg)}
.note{font-size:12px;color:var(--text-soft);background:var(--accent-soft);border-radius:13px;padding:12px 14px;line-height:1.55}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--text-muted);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.seg button.on{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm)}

/* ===== Bottom tab bar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px rgba(6,95,70,.06)}
[data-theme='dark'] .tabbar{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.tabbar-inner{max-width:760px;margin:0 auto;width:100%;display:flex}
.tab-btn{flex:1;border:none;background:transparent;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;min-height:60px;font-size:11px;font-weight:600;position:relative}
.tab-btn .badge{position:absolute;top:8px;right:calc(50% - 26px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--orange-500);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.tab-btn.active{color:var(--accent-strong)}
.tab-btn:active{opacity:.7}
@media(min-width:820px){
  .app{padding-bottom:40px}
  .tabbar{position:sticky;top:16px;bottom:auto;border:1px solid var(--border);border-radius:16px;max-width:760px;margin:0 auto 18px;box-shadow:var(--shadow-md);overflow:hidden}
  .tab-btn{flex-direction:row;gap:8px;min-height:52px;font-size:13.5px}
  .tab-btn.active{background:var(--accent-soft)}
  .tab-btn .badge{position:static;margin-left:2px}
}

/* ===== FAB ===== */
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:60;width:58px;height:58px;padding:0;border:none;border-radius:50%;background:#1b1e26;color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(20,22,30,.4);transition:transform .12s}
.fab:active{transform:scale(.95)}
@media(min-width:820px){.fab{bottom:24px;right:calc(50% - 380px + 8px)}}
@media(max-width:840px){.fab{right:16px}}

/* ===== Bottom sheet ===== */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(8,24,18,.42);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@media(min-width:820px){.overlay{align-items:center}}
.sheet{width:100%;max-width:620px;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);max-height:88dvh;display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:820px){.sheet{border-radius:22px;max-height:82dvh}}
.sheet-handle{width:40px;height:4px;border-radius:999px;background:var(--border);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:6px 18px 12px}
.sheet-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.sheet-head .close{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);display:grid;place-items:center}
.sheet-search{padding:0 18px 10px}
.qa-list{overflow-y:auto;padding:0 18px;flex:1;-webkit-overflow-scrolling:touch;min-height:120px}
.qa-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)}
.qa-star{flex:none;width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--text-muted);display:grid;place-items:center}
.qa-star.on{color:var(--star)}
.qa-pick{flex:1;text-align:left;border:none;background:transparent;padding:9px 8px;border-radius:10px;color:var(--text);display:flex;flex-direction:column;gap:2px;min-height:48px}
.qa-pick .n{font-weight:700;font-size:14.5px}
.qa-pick .m{font-size:11.5px;color:var(--text-muted)}
.qa-item.sel .qa-pick{background:var(--accent-soft)}
.qa-item.sel .qa-pick .n{color:var(--accent-strong)}
.qa-empty{padding:24px 8px;text-align:center;color:var(--text-muted);font-size:13.5px}
.sheet-foot{border-top:1px solid var(--border);padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:var(--surface);display:grid;gap:10px}
.sheet-foot .picked{font-size:13px;color:var(--text-soft);font-weight:600}
.sheet-foot .picked b{color:var(--accent-strong)}
.qa-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.cf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.cf-grid{grid-template-columns:repeat(3,1fr)}}
.unit-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.unit-chip{border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-soft);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;min-height:40px}
.unit-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.qa-gram{margin-top:9px;font-size:13px;color:var(--text-soft);font-weight:600}
.qa-gram b{color:var(--accent-strong)}
.qa-cart{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;max-height:104px;overflow-y:auto}
.qa-cchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 11px;font-size:12.5px;font-weight:700}
.qa-cchip .cdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.qa-cchip button{border:none;background:transparent;color:var(--accent-strong);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;opacity:.75}
.qa-cchip button:active{opacity:1}

/* ===== Hồ sơ ===== */
.profile-chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 13px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:150px}
.profile-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-chip:active{transform:scale(.96)}
.profile-list{display:flex;flex-direction:column;gap:9px}
.profile-row{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--surface-2);border-radius:14px;padding:6px 8px 6px 6px}
.profile-row.on{border-color:var(--accent);background:var(--accent-soft)}
.profile-pick{flex:1;display:flex;align-items:center;gap:9px;border:none;background:transparent;color:var(--text);padding:9px 8px;border-radius:10px;font-weight:700;font-size:14.5px;min-height:46px;text-align:left}
.profile-pick .tagnow{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent-strong)}
/* ===== Tổng kết tuần ===== */
.week-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-bottom:16px}
.week-stat{border:1.5px solid var(--border);background:var(--surface-2);border-radius:13px;padding:11px}
.week-stat .k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px}
.week-stat .k .swatch{width:9px;height:9px;border-radius:3px}
.week-stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.week-stat .v small{font-size:11px;font-weight:700;color:var(--text-muted);margin-left:2px}
.week-bars{display:flex;gap:5px;align-items:flex-end;height:118px;padding-top:16px}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.week-val{font-size:9.5px;font-weight:700;color:var(--text-muted);height:12px;line-height:1}
.week-bar{flex:1;width:100%;display:flex;align-items:flex-end}
.week-bar>span{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:3px;background:var(--input-border);transition:height .4s cubic-bezier(.4,0,.2,1)}
.week-col.today .week-bar>span{background:linear-gradient(180deg,var(--orange-400),var(--orange-600))}
.week-lbl{font-size:10px;color:var(--text-muted);font-weight:600;text-align:center;line-height:1.25}
.week-col.today .week-lbl{color:var(--accent-strong);font-weight:800}
.fade{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   MacroDay — bản HTML một file (vanilla JS). Tab + tông emerald.
   Thêm món qua nút nổi "+" mở khung trượt: tìm theo tên, đánh dấu yêu thích
   (tự đẩy lên đầu), gõ gram tự do (nhận dấu phẩy). Sửa dữ liệu: BUILTIN_FOODS.
   ===================================================================== */

var MACRO_KEYS=['calories','carb','protein','fat','fiber','sugar'];
var MACRO_LABELS={calories:'Calories',carb:'Carb',protein:'Protein',fat:'Chất béo',fiber:'Chất xơ',sugar:'Đường'};
var MACRO_UNITS={calories:'kcal',carb:'g',protein:'g',fat:'g',fiber:'g',sugar:'g'};
var MACRO_COLORS={calories:'#ff7a1a',carb:'#3b82f6',protein:'#ff4d6d',fat:'#ffa726',fiber:'#10b981',sugar:'#a855f7'};
var MACRO_COLORS_DARK={calories:'#e2660b',carb:'#2563eb',protein:'#e11d48',fat:'#f97316',fiber:'#059669',sugar:'#9333ea'};
var BAR_MACROS=['carb','protein','fat','fiber','sugar']; // các thanh macro (calo hiển thị ở vòng)
var RING_KEYS=['protein','carb','fat','fiber'];

function ic(name,s){s=s||22;var p={
  overview:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 3.5"/>',
  log:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  foods:'<path d="M3 11h18"/><path d="M4 11a8 8 0 0 0 16 0"/><path d="M8 7c0-1.5 1-2.5 1-2.5M12 7c0-1.5 1-2.5 1-2.5M16 7c0-1.5 1-2.5 1-2.5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  star:'<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18.9 6.1 21l1.2-6.5L2.5 9.4l6.6-.9z"/>',
  sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  bowl:'<path d="M3 11h18"/><path d="M4 11a8 8 0 0 0 16 0"/>',
  spark:'<path d="M12 3v18M3 12h18"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.4 3-5.5 6.5-5.5s6.5 2.1 6.5 5.5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14.6c2.3.6 4 2.2 4 4.4"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||'')+'</svg>';}

var BUILTIN_FOODS=[
  {id:'rice-white',name:'Cơm trắng',baseGrams:100,calories:130,protein:2.7,carb:28,fat:0.3,fiber:0.4,source:'builtin'},
  {id:'rice-brown',name:'Cơm gạo lứt',baseGrams:100,calories:123,protein:2.7,carb:25.6,fat:1,fiber:1.6,source:'builtin'},
  {id:'chicken-breast',name:'Ức gà (luộc)',baseGrams:100,calories:165,protein:31,carb:0,fat:3.6,fiber:0,source:'builtin'},
  {id:'chicken-thigh',name:'Đùi gà (không da)',baseGrams:100,calories:209,protein:26,carb:0,fat:10.9,fiber:0,source:'builtin'},
  {id:'beef-lean',name:'Thịt bò nạc (áp chảo)',baseGrams:100,calories:217,protein:26,carb:0,fat:12,fiber:0,source:'builtin'},
  {id:'pork-lean',name:'Thịt heo nạc (luộc)',baseGrams:100,calories:242,protein:27,carb:0,fat:14,fiber:0,source:'builtin'},
  {id:'egg',name:'Trứng gà (luộc)',baseGrams:50,calories:78,protein:6.3,carb:0.6,fat:5.3,fiber:0,source:'builtin'},
  {id:'salmon',name:'Cá hồi (áp chảo)',baseGrams:100,calories:208,protein:20,carb:0,fat:13,fiber:0,source:'builtin'},
  {id:'tuna',name:'Cá ngừ',baseGrams:100,calories:132,protein:28,carb:0,fat:1.3,fiber:0,source:'builtin'},
  {id:'shrimp',name:'Tôm (luộc)',baseGrams:100,calories:99,protein:24,carb:0.2,fat:0.3,fiber:0,source:'builtin'},
  {id:'tofu',name:'Đậu phụ',baseGrams:100,calories:76,protein:8,carb:1.9,fat:4.8,fiber:0.3,source:'builtin'},
  {id:'sweet-potato',name:'Khoai lang (hấp)',baseGrams:100,calories:86,protein:1.6,carb:20,fat:0.1,fiber:3,source:'builtin'},
  {id:'potato',name:'Khoai tây (luộc)',baseGrams:100,calories:87,protein:1.9,carb:20,fat:0.1,fiber:1.8,source:'builtin'},
  {id:'oats',name:'Yến mạch (nấu chín)',baseGrams:100,calories:71,protein:2.5,carb:12,fat:1.5,fiber:1.7,source:'builtin'},
  {id:'banana',name:'Chuối',baseGrams:100,calories:89,protein:1.1,carb:23,fat:0.3,fiber:2.6,source:'builtin'},
  {id:'apple',name:'Táo',baseGrams:100,calories:52,protein:0.3,carb:14,fat:0.2,fiber:2.4,source:'builtin'},
  {id:'broccoli',name:'Bông cải xanh (luộc)',baseGrams:100,calories:35,protein:2.4,carb:7.2,fat:0.4,fiber:3.3,source:'builtin'},
  {id:'spinach',name:'Rau chân vịt (luộc)',baseGrams:100,calories:23,protein:3,carb:3.8,fat:0.3,fiber:2.4,source:'builtin'},
  {id:'avocado',name:'Bơ',baseGrams:100,calories:160,protein:2,carb:8.5,fat:15,fiber:6.7,source:'builtin'},
  {id:'peanut',name:'Đậu phộng (rang)',baseGrams:100,calories:567,protein:26,carb:16,fat:49,fiber:8.5,source:'builtin'},
  {id:'almond',name:'Hạnh nhân',baseGrams:100,calories:579,protein:21,carb:22,fat:50,fiber:12.5,source:'builtin'},
  {id:'milk',name:'Sữa tươi',baseGrams:100,calories:61,protein:3.2,carb:4.8,fat:3.3,fiber:0,source:'builtin'},
  {id:'yogurt',name:'Sữa chua Hy Lạp',baseGrams:100,calories:59,protein:10,carb:3.6,fat:0.4,fiber:0,source:'builtin'},
  {id:'bread',name:'Bánh mì',baseGrams:100,calories:265,protein:9,carb:49,fat:3.2,fiber:2.7,source:'builtin'},
  {id:'pho',name:'Phở bò (1 tô)',baseGrams:400,calories:350,protein:25,carb:45,fat:6,fiber:2,source:'builtin'}
];
// Gắn đơn vị tự nhiên cho món dựng sẵn: tên đơn vị → số gram mỗi đơn vị.
(function(){var U={
  'rice-white':{'bát':200,'chén':150},'rice-brown':{'bát':200,'chén':150},'oats':{'bát':200},
  'chicken-breast':{'miếng':120},'chicken-thigh':{'cái':90},'salmon':{'miếng':120},'tofu':{'miếng':60},
  'egg':{'quả':50,'trái':50},'shrimp':{'con':15},
  'sweet-potato':{'củ':150},'potato':{'củ':150},
  'banana':{'quả':120,'trái':120},'apple':{'quả':150,'trái':150},
  'milk':{'ly':200,'cốc':200,'hộp':180},'yogurt':{'hộp':100},'bread':{'lát':25,'ổ':90},
  'pho':{'tô':400,'bát':400}
};BUILTIN_FOODS.forEach(function(f){if(U[f.id])f.units=U[f.id];});})();
// Gắn lượng đường (g mỗi baseGrams) cho món dựng sẵn (ước lượng; món không ghi = 0).
(function(){var SG={banana:12,apple:10,'sweet-potato':6,potato:1,oats:0.5,milk:5,yogurt:4,bread:5,pho:2,tofu:0.5,broccoli:1.4,spinach:0.4,'rice-brown':0.4,almond:4};BUILTIN_FOODS.forEach(function(f){f.sugar=SG[f.id]||0;});})();
var DEFAULT_GOAL={calories:2000,carb:220,protein:120,fat:60,fiber:30,sugar:50};

function round1(n){var r=Math.round(n*10)/10;return r===0?0:r;}
function safe(n){return isFinite(n)&&n>0?n:0;}
function pGrams(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?n:0;} // nhận dấu phẩy
function parseSumG(v){ // "300+150" -> 450 ; nhận dấu phẩy và phép cộng
  return String(v==null?'':v).split('+').reduce(function(s,p){var n=parseFloat(p.replace(',','.'));return s+(isFinite(n)&&n>0?n:0);},0);}
var GLOBAL_UNITS={g:1,gam:1,gr:1,gram:1,kg:1000,kilo:1000,kilogam:1000,lang:100};
// Danh sách đơn vị cho một món: gram + đơn vị riêng của món + phần + kg.
function unitOptions(food){var opts=[{u:'g',g:1}];
  if(food&&food.units){for(var k in food.units)if(food.units.hasOwnProperty(k))opts.push({u:k,g:food.units[k]});}
  opts.push({u:'phần',g:(food&&food.baseGrams)||100});opts.push({u:'kg',g:1000});return opts;}
function unitToGrams(food,amount,unit){amount=parseFloat(String(amount==null?'':amount).replace(',','.'))||0;
  if(!unit||unit==='g')return amount;
  if(food&&food.units&&food.units[unit]!=null)return amount*food.units[unit];
  var nu=normKey(unit);
  if(nu==='phan'||nu==='suat')return amount*((food&&food.baseGrams)||100);
  if(GLOBAL_UNITS[nu]!=null)return amount*GLOBAL_UNITS[nu];
  return amount;}
function amountLabel(amount,unit){var a=parseFloat(String(amount==null?'':amount).replace(',','.'))||0;return round1(a)+(unit&&unit!=='g'?(' '+unit):'g');}
function perBaseOf(f){var o={};MACRO_KEYS.forEach(function(k){o[k]=f[k]||0;});return o;}
function entryMacros(e){var base=safe(e.baseGrams)||100,factor=safe(e.grams)/base;var m={};MACRO_KEYS.forEach(function(k){m[k]=round1(((e.perBase&&e.perBase[k])||0)*factor);});return m;}
function totalMacros(entries){var acc={};MACRO_KEYS.forEach(function(k){acc[k]=0;});
  entries.forEach(function(e){var m=entryMacros(e);MACRO_KEYS.forEach(function(k){acc[k]+=m[k];});});
  MACRO_KEYS.forEach(function(k){acc[k]=round1(acc[k]);});return acc;}
function remainingMacros(goal,used){var r={};MACRO_KEYS.forEach(function(k){r[k]=round1(Math.max(0,goal[k]-used[k]));});return r;}
function pct(u,g){if(g<=0)return 0;return Math.max(0,Math.min(100,(u/g)*100));}
function rawPct(u,g){if(g<=0)return 0;return (u/g)*100;}

var HISTORY_DAYS=7; // số ngày gần nhất được lưu (đổi số này nếu muốn 5, 10…)
function read(k,f){try{var r=localStorage.getItem(k);return r?JSON.parse(r):f;}catch(e){return f;}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}

// ===== Hồ sơ người dùng — mỗi người 1 hồ sơ, dữ liệu HOÀN TOÀN tách biệt =====
var GK={profiles:'macroday.profiles.v1',active:'macroday.active.v1'};
function loadProfiles(){return read(GK.profiles,[]);}
function saveProfiles(p){write(GK.profiles,p);}
function activePid(){return read(GK.active,'');}
function setActivePid(id){write(GK.active,id);}
// Mọi khoá lưu trữ đều gắn tiền tố theo hồ sơ → dữ liệu người này không đụng người kia.
function buildK(pid){var b='macroday.p.'+pid+'.';return {goal:b+'goal',log:b+'log',logDate:b+'logDate',custom:b+'custom',sheet:b+'sheet',sheetUrl:b+'sheetUrl',theme:b+'theme',fav:b+'fav',history:b+'history'};}
function initProfiles(){
  var profs=loadProfiles();
  if(profs.length===0){
    // Lần đầu chạy bản có hồ sơ: chuyển dữ liệu cũ (nếu có) sang hồ sơ mặc định, không mất dữ liệu.
    var pid='me';var nk=buildK(pid);
    var oldMap={goal:'macroday.goal.v1',log:'macroday.log.v1',logDate:'macroday.logDate.v1',custom:'macroday.customFoods.v1',sheet:'macroday.sheetFoods.v1',sheetUrl:'macroday.sheetUrl.v1',theme:'macroday.theme.v1',fav:'macroday.favorites.v1',history:'macroday.history.v1'};
    for(var s in oldMap){if(!oldMap.hasOwnProperty(s))continue;var raw=null;try{raw=localStorage.getItem(oldMap[s]);}catch(e){}if(raw!=null){try{localStorage.setItem(nk[s],raw);}catch(e){}}}
    profs=[{id:pid,name:'Của tôi'}];saveProfiles(profs);setActivePid(pid);
  }
  var act=activePid();var ok=false;profs.forEach(function(p){if(p.id===act)ok=true;});
  if(!act||!ok)setActivePid(profs[0].id);
}
initProfiles();
var K=buildK(activePid());
function activeName(){var n='';loadProfiles().forEach(function(p){if(p.id===activePid())n=p.name;});return n||'Của tôi';}
function themeFromStore(){var t=read(K.theme,'');if(t==='light'||t==='dark')return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function offsetKey(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysAgo(key){return Math.round((new Date(todayKey()+'T00:00:00')-new Date(key+'T00:00:00'))/86400000);}
function dowLabel(key){return ['CN','T2','T3','T4','T5','T6','T7'][new Date(key+'T00:00:00').getDay()];}
function ddmm(key){var p=key.split('-');return p[2]+'/'+p[1];}

// ---- Lịch sử theo ngày (tự gối xoá quá HISTORY_DAYS ngày) ----
function historyLoad(){return read(K.history,[]);}
function historySave(h){write(K.history,h);}
function pruneHistory(h){
  var seen={};var out=[];
  h.forEach(function(d){if(!d||!d.date||seen[d.date])return;var ago=daysAgo(d.date);if(ago>0&&ago<HISTORY_DAYS){seen[d.date]=1;out.push(d);}});
  out.sort(function(a,b){return a.date<b.date?1:-1;});
  return out.slice(0,HISTORY_DAYS);
}
function archiveDay(date,totals,entries){
  var h=historyLoad().filter(function(d){return d.date!==date;});
  h.unshift({date:date,calories:totals.calories,protein:totals.protein,carb:totals.carb,fat:totals.fat,fiber:totals.fiber,entries:entries||[]});
  historySave(pruneHistory(h));
}
// Khi mở app vào ngày mới: lưu tổng + chi tiết món của ngày cũ vào lịch sử rồi làm mới nhật ký.
function rolloverIfNeeded(){
  var sd=read(K.logDate,'');
  if(!sd){write(K.logDate,todayKey());return;}
  if(sd!==todayKey()){
    var old=read(K.log,[]);
    if(old&&old.length)archiveDay(sd,totalMacros(old),old);
    write(K.log,[]);write(K.logDate,todayKey());
  }
  historySave(pruneHistory(historyLoad())); // dọn ngày quá hạn
}
function entriesForDate(key){
  if(key===todayKey())return S.entries;
  var found=null;historyLoad().forEach(function(d){if(d.date===key)found=d;});
  return found&&found.entries?found.entries:[];
}
function loadLog(){rolloverIfNeeded();return read(K.log,[]);}

// Dữ liệu 7 ngày (hôm nay lấy tổng đang chạy, ngày cũ lấy từ lịch sử).
function weekData(){
  var today=todayKey();
  var days=[],totals={};MACRO_KEYS.forEach(function(k){totals[k]=0;});
  for(var i=HISTORY_DAYS-1;i>=0;i--){var key=offsetKey(i);var isToday=key===today;
    var t=dayTotals(key);
    MACRO_KEYS.forEach(function(k){totals[k]+=t[k]||0;});
    days.push({date:key,dow:dowLabel(key),ddmm:ddmm(key),isToday:isToday,totals:t});}
  MACRO_KEYS.forEach(function(k){totals[k]=round1(totals[k]);});
  return {days:days,totals:totals};
}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').replace(/\s+/g,' ').trim();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ---------- Google Sheets ----------
function normKey(k){return (k||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').replace(/[^a-z0-9]/g,'');}
function toNum(v){if(typeof v==='number')return v;var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;}
function rowToFood(raw,i){var map={};for(var key in raw)if(raw.hasOwnProperty(key))map[normKey(key)]=raw[key];
  function pick(){for(var j=0;j<arguments.length;j++){var k=arguments[j];if(map[k]!==undefined&&map[k]!=='')return map[k];}return undefined;}
  var name=String(pick('name','ten','tenmon','thucpham','mon')||'').trim();if(!name)return null;
  var baseGrams=toNum(pick('basegrams','gram','grams','khoiluong','baseg'))||100;
  return {id:'sheet-'+normKey(name)+'-'+i,name:name,baseGrams:baseGrams,calories:toNum(pick('calories','calo','kcal','nangluong')),protein:toNum(pick('protein','dam','chatdam')),carb:toNum(pick('carb','carbs','tinhbot','carbohydrate','bot')),fat:toNum(pick('fat','beo','chatbeo','lipid')),fiber:toNum(pick('fiber','xo','chatxo','fibre')),sugar:toNum(pick('sugar','duong')),source:'sheet'};}
function normalizeRecords(recs){var out=[];recs.forEach(function(r,i){var f=rowToFood(r,i);if(f)out.push(f);});return out;}
function loadGviz(url){return fetch(url).then(function(res){return res.text();}).then(function(text){var start=text.indexOf('{'),end=text.lastIndexOf('}');if(start===-1||end===-1)throw new Error('Định dạng gviz không hợp lệ.');var json=JSON.parse(text.slice(start,end+1));var cols=json.table.cols.map(function(c){return (c.label||c.id||'').toString();});return json.table.rows.map(function(row){var o={};row.c.forEach(function(cell,i){o[cols[i]||('col'+i)]=cell&&cell.v!=null?String(cell.v):'';});return o;});});}
var jsonpN=0;
function jsonp(url,timeout){timeout=timeout||12000;return new Promise(function(resolve,reject){var cb='__macroday_jsonp_'+Date.now()+'_'+(jsonpN++);var sep=url.indexOf('?')>=0?'&':'?';var s=document.createElement('script');var done=false;function cleanup(){if(s.parentNode)s.parentNode.removeChild(s);try{delete window[cb];}catch(e){window[cb]=undefined;}}var timer=setTimeout(function(){if(done)return;done=true;cleanup();reject(new Error('Hết thời gian chờ khi tải Google Sheets.'));},timeout);window[cb]=function(data){if(done)return;done=true;clearTimeout(timer);cleanup();resolve(data);};s.onerror=function(){if(done)return;done=true;clearTimeout(timer);cleanup();reject(new Error('Không tải được Google Sheets. Kiểm tra URL/quyền chia sẻ.'));};s.src=url+sep+'callback='+cb;document.body.appendChild(s);});}
function fetchFoodsFromSheet(url){var t=(url||'').trim();if(!t)return Promise.reject(new Error('Chưa nhập URL Google Sheets.'));if(t.indexOf('/gviz/tq')>=0)return loadGviz(t).then(normalizeRecords);return jsonp(t).then(function(data){var recs=[];if(Array.isArray(data))recs=data;else if(data&&typeof data==='object'){if(Array.isArray(data.data))recs=data.data;else if(Array.isArray(data.foods))recs=data.foods;else if(Array.isArray(data.rows))recs=data.rows;}if(recs.length===0)throw new Error('Không tìm thấy dữ liệu thực phẩm trong phản hồi.');return normalizeRecords(recs);});}

function parseMyFoods(text){var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);var foods=[],errors=[];
  lines.forEach(function(line,idx){if(/t[êe]n\s*m[óo]n/i.test(line)&&/calo/i.test(line))return;
    var parts=line.split(/\t|,|;/).map(function(p){return p.trim();});
    if(parts.length<6){errors.push('Dòng '+(idx+1)+': cần đủ 6 cột (tên, gram, protein, carb, fat, calo).');return;}
    var name=parts[0];if(!name){errors.push('Dòng '+(idx+1)+': thiếu tên món.');return;}
    var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0;};
    foods.push({id:'custom-'+Date.now()+'-'+idx+'-'+Math.random().toString(36).slice(2,5),name:name,baseGrams:num(parts[1])||100,protein:num(parts[2]),carb:num(parts[3]),fat:num(parts[4]),calories:num(parts[5]),fiber:num(parts[6]),sugar:num(parts[7]),source:'custom'});});
  return {foods:foods,errors:errors};}

function polar(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function arcPath(cx,cy,r,start,end){var sweep=Math.min(end-start,359.999);var s=polar(cx,cy,r,start);var e=polar(cx,cy,r,start+sweep);var large=sweep>180?1:0;return 'M '+s.x+' '+s.y+' A '+r+' '+r+' 0 '+large+' 1 '+e.x+' '+e.y;}
function mixHex(hex,target,t){hex=hex.replace('#','');var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);var tr=(target>>16)&255,tg=(target>>8)&255,tb=target&255;r=Math.round(r+(tr-r)*t);g=Math.round(g+(tg-g)*t);b=Math.round(b+(tb-b)*t);return '#'+[r,g,b].map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function lighten(hex){return mixHex(hex,0xffffff,0.42);}

  h+='</div></details></section>';return h;}

var TABS=[{id:'overview',label:'Tổng quan',icon:'overview'},{id:'goals',label:'Mục tiêu',icon:'target'}];
function tabbarHTML(){var h='<nav class="tabbar" role="tablist"><div class="tabbar-inner">';
  TABS.forEach(function(t){var active=S.tab===t.id;var badge=(t.id==='overview'&&S.entries.length)?('<span class="badge">'+S.entries.length+'</span>'):'';
    h+='<button class="tab-btn'+(active?' active':'')+'" data-tab="'+t.id+'" role="tab" aria-selected="'+active+'">'+ic(t.icon,22)+'<span>'+t.label+'</span>'+badge+'</button>';});
  h+='</div></nav>';return h;}

// ---------- Quick-add bottom sheet ----------
function qaFilteredFoods(){var q=norm(S.qaSearch);var list=orderedFoods();if(!q)return list;return list.filter(function(f){return norm(f.name).indexOf(q)>=0;});}
function qaListHTML(){var list=qaFilteredFoods();if(list.length===0)return '<div class="qa-empty">Không tìm thấy món phù hợp.<br>Bạn có thể thêm ở tab “Món ăn”.</div>';
  var h='';list.forEach(function(f){var sel=S.qaFoodId===f.id;var fav=isFav(f.id);var tag=f.source==='custom'?'của tôi':f.source==='sheet'?'sheet':'';
    h+='<div class="qa-item'+(sel?' sel':'')+'">';
    h+='<button type="button" class="qa-star'+(fav?' on':'')+'" data-fav="'+f.id+'" aria-label="Yêu thích '+esc(f.name)+'" aria-pressed="'+fav+'">'+ic('star',20)+'</button>';
    h+='<button type="button" class="qa-pick" data-pick="'+f.id+'"><span class="n">'+esc(f.name)+(tag?' <span style="color:var(--text-muted);font-weight:600;font-size:11px">· '+tag+'</span>':'')+'</span><span class="m">'+round1(f.calories)+' kcal · P'+round1(f.protein)+' C'+round1(f.carb)+' F'+round1(f.fat)+' / '+round1(f.baseGrams)+'g</span></button>';
    h+='</div>';});
  return h;}
function qaExisting(f){for(var i=0;i<S.entries.length;i++)if(S.entries[i].foodId===f.id)return S.entries[i];return null;}
function qaFooterHTML(){var f=S.qaFoodId?foodById(S.qaFoodId):null;var n=S.qaCart.length;var h='';
  // danh sách chờ
  if(n){h+='<div class="qa-cart">';S.qaCart.forEach(function(it,idx){h+='<span class="qa-cchip"><span class="cdot"></span>'+esc(it.name)+' · '+esc(it.label)+'<button type="button" data-cart-rm="'+idx+'" aria-label="Bỏ khỏi danh sách">'+ic('close',13)+'</button></span>';});h+='</div>';}
  // món đang chọn
  if(f){
    var opts=unitOptions(f);var okUnit=false;opts.forEach(function(o){if(o.u===S.qaUnit)okUnit=true;});if(!okUnit)S.qaUnit='g';
    var chips=opts.map(function(o){return '<button type="button" class="unit-chip'+(S.qaUnit===o.u?' on':'')+'" data-unit="'+o.u+'">'+o.u+'</button>';}).join('');
    var amt=S.qaAmount;var grams=unitToGrams(f,amt,S.qaUnit);var ph=(S.qaUnit==='g')?String(round1(f.baseGrams)):'1';
    h+='<div class="picked">Đã chọn: <b>'+esc(f.name)+'</b> · gốc '+round1(f.baseGrams)+'g</div>';
    h+='<div class="unit-row">'+chips+'</div>';
    h+='<div class="qa-add-row"><div class="field"><input id="qa-amt" class="input" type="text" inputmode="decimal" value="'+esc(amt)+'" placeholder="'+ph+'" aria-label="Số lượng"></div><button type="button" class="btn" id="qa-add">'+ic('plus',18)+' Vào danh sách</button></div>';
    h+='<div class="qa-gram" id="qa-gram">= <b>'+round1(grams||unitToGrams(f,ph,S.qaUnit))+' g</b></div>';
  } else if(!n){
    h+='<div class="picked">Chọn món ở trên, nhập số lượng rồi bấm <b>Vào danh sách</b>. Chọn nhiều món tùy thích.</div>';
  }
  // nút hoàn tất
  var eff=n+(f?1:0);
  h+='<button type="button" class="btn '+(eff?'btn-primary':'')+' btn-block" id="qa-commit" style="margin-top:12px">'+(eff?(ic('plus',18)+' Xong · thêm '+eff+' món vào nhật ký'):'Đóng')+'</button>';
  return h;}
function sheetHTML(){
  var h='<div class="overlay" id="qa-overlay"><div class="sheet" role="dialog" aria-label="Thêm món">';
  h+='<div class="sheet-handle"></div>';
  h+='<div class="sheet-head"><h3>Thêm món</h3><button type="button" class="close" id="qa-close" aria-label="Đóng">'+ic('close',20)+'</button></div>';
  h+='<div class="sheet-search"><div class="field"><input id="qa-search" class="input" type="text" placeholder="Gõ tên món để tìm nhanh…" value="'+esc(S.qaSearch)+'" style="padding-left:42px;background-image:none"></div></div>';
  h+='<div class="qa-list" id="qa-list">'+qaListHTML()+'</div>';
  h+='<div class="sheet-foot" id="qa-foot">'+qaFooterHTML()+'</div>';
  h+='</div></div>';return h;}

// ---------- Render ----------
function render(){
  document.documentElement.setAttribute('data-theme',S.theme);
  var content='';
  if(S.tab==='overview')content=overviewTab();
  else if(S.tab==='foods')content=foodsTab();
  else if(S.tab==='goals')content=goalsTab();
  var h='<div class="app"><header class="topbar"><div class="brand"><div class="brand-logo" aria-hidden>'+ic('spark',22)+'</div><div><h1>MacroDay</h1><p>Theo dõi dinh dưỡng hằng ngày</p></div></div>';
  h+='<div style="display:flex;gap:8px;align-items:center"><button type="button" class="profile-chip" id="profile-chip" aria-label="Hồ sơ: '+esc(activeName())+'">'+ic('user',16)+'<span>'+esc(activeName())+'</span></button>';
  h+='<button type="button" class="icon-btn" id="theme-toggle" aria-label="Đổi sáng/tối">'+ic(S.theme==='dark'?'moon':'sun',20)+'</button></div></header>';
  h+=tabbarHTML();
  h+='<main class="fade">'+content+'</main></div>';
  if(S.tab==='overview')h+='<button type="button" class="fab" id="fab-add" aria-label="Thêm món">'+ic('plus',26)+'</button>';
  if(S.quickAdd)h+=sheetHTML();
  if(S.dayView)h+=dayViewHTML();
  document.getElementById('app').innerHTML=h;
  bind();
  if(S.quickAdd){var qs=document.getElementById('qa-search');if(qs&&!S.qaFoodId){/* để con trỏ sẵn ở ô tìm */}}
}

function openQuickAdd(){S.quickAdd=true;S.qaSearch='';S.qaFoodId='';S.qaAmount='';S.qaUnit='g';S.qaCart=[];render();}
function closeQuickAdd(){S.quickAdd=false;S.qaCart=[];render();}
// Gom món đang chọn vào danh sách chờ.
function qaPushCurrent(){var f=S.qaFoodId?foodById(S.qaFoodId):null;if(!f)return false;
  var grams=unitToGrams(f,S.qaAmount,S.qaUnit)||(f.baseGrams||100);
  var label=amountLabel(S.qaAmount||(S.qaUnit==='g'?(f.baseGrams||100):1),S.qaUnit);
  S.qaCart.push({foodId:f.id,name:f.name,baseGrams:f.baseGrams||100,perBase:perBaseOf(f),grams:round1(grams),label:label});
  S.qaFoodId='';S.qaAmount='';S.qaUnit='g';return true;}
// Thêm toàn bộ danh sách chờ vào nhật ký (cộng dồn nếu trùng món).
function qaCommit(){qaPushCurrent();
  S.qaCart.forEach(function(it){var ex=null;for(var i=0;i<S.entries.length;i++)if(S.entries[i].foodId===it.foodId)ex=S.entries[i];
    if(ex){ex.grams=round1(ex.grams+it.grams);ex.times=(ex.times||1)+1;ex.label=round1(ex.grams)+'g';}
    else S.entries.unshift({id:uid(),foodId:it.foodId,name:it.name,baseGrams:it.baseGrams,perBase:it.perBase,grams:it.grams,label:it.label,times:1});});
  persist();closeQuickAdd();}
function selectMacro(k){S.selected=k;if(S.tab!=='overview'){S.tab='overview';render();}else updateDynamic();}

// cập nhật lại phần list + footer trong sheet mà không dựng lại cả app (giữ ô tìm)
function refreshSheet(){var l=document.getElementById('qa-list');if(l)l.innerHTML=qaListHTML();var f=document.getElementById('qa-foot');if(f)f.innerHTML=qaFooterHTML();bindSheetInner();}
function bindSheetInner(){
  document.querySelectorAll('[data-fav]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();toggleFav(b.getAttribute('data-fav'));refreshSheet();};});
  document.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){S.qaFoodId=b.getAttribute('data-pick');S.qaUnit='g';S.qaAmount='';refreshSheet();var g=document.getElementById('qa-amt');if(g)g.focus();};});
  document.querySelectorAll('[data-unit]').forEach(function(b){b.onclick=function(){S.qaUnit=b.getAttribute('data-unit');var f=document.getElementById('qa-foot');if(f)f.innerHTML=qaFooterHTML();bindSheetInner();var a=document.getElementById('qa-amt');if(a)a.focus();};});
  var amt=document.getElementById('qa-amt');if(amt)amt.addEventListener('input',function(){S.qaAmount=amt.value;var f=foodById(S.qaFoodId);var gm=document.getElementById('qa-gram');if(f&&gm){var grams=unitToGrams(f,amt.value,S.qaUnit);gm.innerHTML='= <b>'+round1(grams||0)+' g</b>';}});
  var add=document.getElementById('qa-add');if(add)add.onclick=function(){if(qaPushCurrent()){refreshSheet();var qs=document.getElementById('qa-search');if(qs){qs.focus();qs.select&&qs.select();}}};
  document.querySelectorAll('[data-cart-rm]').forEach(function(b){b.onclick=function(){var i=parseInt(b.getAttribute('data-cart-rm'),10);S.qaCart.splice(i,1);refreshSheet();};});
  var commit=document.getElementById('qa-commit');if(commit)commit.onclick=function(){if(S.qaCart.length||S.qaFoodId)qaCommit();else closeQuickAdd();};
}

function bind(){
  var app=document.getElementById('app');
  app.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){S.tab=b.getAttribute('data-tab');S.pasteStatus=null;S.myFoodsStatus=null;S.sheetStatus=null;render();window.scrollTo({top:0,behavior:'smooth'});});});
  app.querySelectorAll('[data-macro]').forEach(function(el){el.addEventListener('click',function(){selectMacro(el.getAttribute('data-macro'));});});
  var tt=document.getElementById('theme-toggle');if(tt)tt.addEventListener('click',function(){S.theme=S.theme==='dark'?'light':'dark';persist();render();});
  // hồ sơ
  var pc=document.getElementById('profile-chip');if(pc)pc.addEventListener('click',function(){S.tab='goals';render();window.scrollTo({top:0,behavior:'smooth'});});
  app.querySelectorAll('[data-pick-profile]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-pick-profile');if(id!==activePid())applyProfile(id);});});
  var ap=document.getElementById('add-profile');if(ap)ap.addEventListener('click',function(){var name=(prompt('Tên hồ sơ mới (ví dụ: Vợ):')||'').trim();if(name)addProfile(name);});
  app.querySelectorAll('[data-rename-profile]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-rename-profile');var cur='';loadProfiles().forEach(function(p){if(p.id===id)cur=p.name;});var name=(prompt('Đổi tên hồ sơ:',cur)||'').trim();if(name)renameProfile(id,name);});});
  app.querySelectorAll('[data-del-profile]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-del-profile');var nm='';loadProfiles().forEach(function(p){if(p.id===id)nm=p.name;});if(confirm('Xoá hồ sơ "'+nm+'" cùng toàn bộ dữ liệu của hồ sơ này? Không thể hoàn tác.'))deleteProfile(id);});});
  var tl=document.getElementById('theme-light');if(tl)tl.addEventListener('click',function(){S.theme='light';persist();render();});
  var td=document.getElementById('theme-dark');if(td)td.addEventListener('click',function(){S.theme='dark';persist();render();});
  app.querySelectorAll('[data-goal]').forEach(function(inp){inp.addEventListener('input',function(){S.goal[inp.getAttribute('data-goal')]=Math.max(0,Number(inp.value)||0);persist();});});
  // gram từng món (nhận dấu phẩy)
  app.querySelectorAll('[data-grams]').forEach(function(inp){inp.addEventListener('input',function(){var id=inp.getAttribute('data-grams');var g=round1(parseSumG(inp.value));for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id){S.entries[i].grams=g;S.entries[i].label=g+'g';S.entries[i].times=1;}persist();updateDynamic();});});
  app.querySelectorAll('[data-remove]').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.getAttribute('data-remove');S.entries=S.entries.filter(function(e){return e.id!==id;});persist();render();});});
  var nd=document.getElementById('new-day');if(nd)nd.addEventListener('click',function(){if(confirm('Bắt đầu ngày mới? Nhật ký hôm nay sẽ được xoá.')){S.entries=[];S.selected='calories';persist();render();}});
  var lt=document.getElementById('log-toggle');if(lt)lt.addEventListener('click',function(){S.logCollapsed=!S.logCollapsed;render();});
  app.querySelectorAll('[data-herotab]').forEach(function(b){b.addEventListener('click',function(){S.heroTab=b.getAttribute('data-herotab');S.myFoodsStatus=null;S.sheetStatus=null;render();window.scrollTo({top:0,behavior:'smooth'});});});
  // google sheets
  var su=document.getElementById('sheet-url');if(su)su.addEventListener('input',function(){S.sheetUrl=su.value;persist();});
  var ls=document.getElementById('load-sheet');if(ls)ls.addEventListener('click',function(){if(!S.sheetUrl.trim()){S.sheetStatus={ok:false,msg:'Hãy nhập URL Google Sheets.'};render();return;}ls.disabled=true;ls.textContent='Đang nạp…';fetchFoodsFromSheet(S.sheetUrl).then(function(foods){S.sheetFoods=foods;S.sheetStatus={ok:true,msg:'Đã nạp '+foods.length+' thực phẩm.'};persist();render();}).catch(function(err){S.sheetStatus={ok:false,msg:err.message||'Lỗi.'};render();});});
  var cs=document.getElementById('clear-sheet');if(cs)cs.addEventListener('click',function(){S.sheetFoods=[];persist();render();});
  // món của tôi
  var smf=document.getElementById('save-myfood');if(smf)smf.addEventListener('click',function(){
    var name=(document.getElementById('cf-name').value||'').trim();
    if(!name){S.myFoodsStatus={ok:false,msg:'Hãy nhập tên món.'};render();return;}
    function gv(id){var el=document.getElementById(id);return el?(parseFloat(String(el.value).replace(',','.'))||0):0;}
    function tv(id){var el=document.getElementById(id);return el?(el.value||'').trim():'';}
    var food={id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,5),name:name,baseGrams:gv('cf-base')||100,calories:gv('cf-cal'),protein:gv('cf-pro'),carb:gv('cf-carb'),fat:gv('cf-fat'),fiber:gv('cf-fiber'),sugar:gv('cf-sugar'),source:'custom'};
    var units={};var u1n=tv('cf-u1n'),u1g=gv('cf-u1g'),u2n=tv('cf-u2n'),u2g=gv('cf-u2g');
    if(u1n&&u1g>0)units[u1n]=u1g;if(u2n&&u2g>0)units[u2n]=u2g;
    if(Object.keys(units).length)food.units=units;
    S.customFoods.unshift(food);S.myFoodsStatus={ok:true,msg:'Đã lưu "'+name+'". Giờ có thể chọn ở nút + Thêm món.'};persist();render();});
  var imf=document.getElementById('import-myfoods');if(imf)imf.addEventListener('click',function(){var txt=document.getElementById('myfoods-text').value;if(!txt.trim()){S.myFoodsStatus={ok:false,msg:'Chưa có nội dung để nhập.'};render();return;}var res=parseMyFoods(txt);if(res.foods.length>0)S.customFoods=res.foods.concat(S.customFoods);var msg=[];if(res.foods.length)msg.push('Đã thêm '+res.foods.length+' món.');if(res.errors.length)msg.push(res.errors.join(' '));S.myFoodsStatus={ok:res.foods.length>0,msg:msg.join(' ')};persist();render();});
  app.querySelectorAll('[data-delcustom]').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.getAttribute('data-delcustom');S.customFoods=S.customFoods.filter(function(f){return f.id!==id;});S.favorites=S.favorites.filter(function(x){return x!==id;});persist();render();});});
  // xem chi tiết 1 ngày
  app.querySelectorAll('[data-day]').forEach(function(b){b.addEventListener('click',function(){S.dayView=b.getAttribute('data-day');render();});});
  if(S.dayView){var dov=document.getElementById('day-overlay');if(dov)dov.addEventListener('click',function(ev){if(ev.target===dov){S.dayView=null;render();}});var dcl=document.getElementById('day-close');if(dcl)dcl.addEventListener('click',function(){S.dayView=null;render();});
    var dsave=document.getElementById('day-save');if(dsave)dsave.addEventListener('click',function(){var vals={};MACRO_KEYS.forEach(function(k){var el=document.getElementById('md-'+k);vals[k]=el?(parseFloat(String(el.value).replace(',','.'))||0):0;});saveManualDay(S.dayView,vals);render();});}
  // FAB
  var fab=document.getElementById('fab-add');if(fab)fab.addEventListener('click',openQuickAdd);
  // sheet
  if(S.quickAdd){
    var ov=document.getElementById('qa-overlay');if(ov)ov.addEventListener('click',function(ev){if(ev.target===ov)closeQuickAdd();});
    var cl=document.getElementById('qa-close');if(cl)cl.addEventListener('click',closeQuickAdd);
    var qs=document.getElementById('qa-search');if(qs)qs.addEventListener('input',function(){S.qaSearch=qs.value;var l=document.getElementById('qa-list');if(l)l.innerHTML=qaListHTML();bindSheetInner();});
    bindSheetInner();
  }
}

function updateDynamic(){
  var hb=document.querySelector('.hero-blue');if(hb)hb.innerHTML=heroBlueHTML();
  var mb=document.querySelector('.mbars2');if(mb)mb.outerHTML=macroBars2HTML();
  document.querySelectorAll('.food-item').forEach(function(el,i){var e=S.entries[i];if(!e)return;var m=entryMacros(e);var chips=el.querySelector('.fchips');if(chips)chips.innerHTML='<span class="fchip" style="color:'+MACRO_COLORS.carb+';background:'+MACRO_COLORS.carb+'1a">C '+round1(m.carb)+'g</span><span class="fchip" style="color:'+MACRO_COLORS.protein+';background:'+MACRO_COLORS.protein+'1a">P '+round1(m.protein)+'g</span><span class="fchip" style="color:'+MACRO_COLORS.fat+';background:'+MACRO_COLORS.fat+'1a">F '+round1(m.fat)+'g</span>';var meta=el.querySelector('.fmeta');if(meta)meta.innerHTML='<b>'+round1(m.calories)+' kcal</b> · '+(e.label?e.label:round1(e.grams)+'g');});
  document.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){S.dayView=b.getAttribute('data-day');render();};});
  document.querySelectorAll('[data-herotab]').forEach(function(b){b.onclick=function(){S.heroTab=b.getAttribute('data-herotab');render();};});
}

render();

// Đăng ký service worker để chạy offline (chỉ hoạt động khi mở qua https, vd GitHub Pages).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
